apply plugin: 'com.android.application'

android {
    namespace 'com.github.ma1co.openmemories.tweak'
    compileSdkVersion 29
    buildToolsVersion '30.0.3'

    defaultConfig {
        applicationId 'com.github.ma1co.openmemories.tweak'
        minSdkVersion 10
        targetSdkVersion 10
        versionCode "git -C ${projectDir} rev-list --first-parent --count HEAD".execute().text.trim().toInteger()
        versionName "git -C ${projectDir} describe --always --tags --dirty".execute().text.trim().replaceAll("^v", "")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            // Old cameras need native files extracted by the package installer.
            useLegacyPackaging = true
            // ndk-build and the Linux Makefile already strip their outputs.
            // Do not ask modern AGP to select an NDK/ABI for these legacy files.
            keepDebugSymbols += ['**/*.so']
        }
    }

    sourceSets.main.jniLibs.srcDir "$buildDir/generated/jniLibs"
}

task runMake(type: Exec) {
    // Compile the Linux executable that runs outside the Android chroot.
    executable = 'make'
    args = ["-C", "$projectDir/src/main/jni", "BUILDDIR=$buildDir/platform"]
    doFirst {
        def properties = new Properties()
        def localProperties = rootProject.file('local.properties')
        if (localProperties.isFile()) {
            localProperties.withInputStream { properties.load(it) }
        }
        def linaro = properties.getProperty('linaro.dir')
        if (linaro) {
            def llvm = properties.getProperty('llvm.dir')
            def lld = properties.getProperty('lld.path')
            if (!llvm || !lld) {
                throw new GradleException('Set llvm.dir and lld.path alongside linaro.dir in local.properties')
            }
            // Make executes CC/CXX through a shell, so quote configured paths.
            def quote = { value -> "'" + value.replace("'", "'\\''") + "'" }
            def flags = "--target=arm-linux-gnueabi --sysroot=${quote(linaro + '/arm-linux-gnueabi/libc')} " +
                    "--gcc-toolchain=${quote(linaro)} -fuse-ld=${quote(lld)} " +
                    '-Wno-unused-command-line-argument -Wno-vla-extension -Wno-strict-prototypes'
            args '--always-make',
                    "CC=${quote(llvm + '/bin/clang')} $flags",
                    "CXX=${quote(llvm + '/bin/clang++')} $flags -stdlib=libstdc++ -rtlib=libgcc -no-pie -D_GLIBCXX_USE_CXX11_ABI=0"
        }
    }
}

// Keep the old armeabi toolchain independent of AGP's native-build ABI model.
// Both APK variants use optimized native binaries; NDK handles incremental builds.
tasks.register('buildAndroidNative', Exec) {
    doFirst {
        def properties = new Properties()
        def localProperties = rootProject.file('local.properties')
        if (localProperties.isFile()) {
            localProperties.withInputStream { properties.load(it) }
        }
        def ndk = properties.getProperty('ndk.dir',
                new File(android.sdkDirectory, 'ndk/14.1.3816874').absolutePath)
        def command = ["$ndk/ndk-build"]
        if (System.getProperty('os.name').startsWith('Mac')) {
            environment 'NDK_HOST_AWK', '/usr/bin/awk'
            if (System.getProperty('os.arch') in ['aarch64', 'arm64']) {
                command = ['/usr/bin/arch', '-x86_64', '/bin/bash'] + command
            }
        }
        commandLine command + [
                "NDK_PROJECT_PATH=$projectDir/src/main",
                "NDK_OUT=$buildDir/ndk/obj",
                "NDK_LIBS_OUT=$buildDir/ndk/libs",
                'APP_MODULES=tweak adbd', 'NDK_DEBUG=0', '-j4'
        ]
    }
}

tasks.register('prepareNativeLibraries', Sync) {
    dependsOn 'buildAndroidNative', 'runMake'
    into "$buildDir/generated/jniLibs/armeabi"
    from("$buildDir/ndk/libs/armeabi") {
        include 'libtweak.so', 'adbd'
        rename '^adbd$', 'libadbd.so'
    }
    from("$buildDir/platform") {
        include 'protectiontweak'
        rename '^protectiontweak$', 'libprotectiontweak.so'
    }
    doFirst {
        ["$buildDir/ndk/libs/armeabi/libtweak.so",
         "$buildDir/ndk/libs/armeabi/adbd",
         "$buildDir/platform/protectiontweak"].each { path ->
            if (!file(path).isFile()) {
                throw new GradleException("Missing native build output: $path")
            }
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'prepareNativeLibraries'
}
